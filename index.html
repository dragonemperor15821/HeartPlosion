<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08020a">

    <title>HeartPlosion ❤️</title>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08020a;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        /* Camera feed */
        #webcam {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0;
            pointer-events: none;
        }

        /* Main canvas */
        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        /* Dark romantic overlay */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 30, 100, 0.08),
                    transparent 45%
                ),
                radial-gradient(
                    circle at center,
                    transparent 45%,
                    rgba(0, 0, 0, 0.75) 100%
                );
        }

        /* Loading screen */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            background: #08020a;
            color: white;
            z-index: 20;
            transition: opacity 0.8s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-heart {
            font-size: 52px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .loading-text {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .loading-subtext {
            font-size: 12px;
            opacity: 0.45;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        /* Instructions */
        #instructions {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: white;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #instructions.hidden {
            opacity: 0;
        }

        .instruction-title {
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .instruction-text {
            font-size: 13px;
            opacity: 0.65;
        }

        /* Status */
        #status {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.65;
            text-align: center;
            pointer-events: none;
        }

        /* Camera permission fallback */
        #camera-message {
            position: fixed;
            left: 50%;
            bottom: 75px;
            transform: translateX(-50%);
            width: min(90%, 500px);
            text-align: center;
            color: rgba(255,255,255,0.55);
            font-size: 12px;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #instructions {
                top: 20px;
                width: 90%;
            }

            #status {
                bottom: 20px;
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Webcam -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Everything we draw -->
    <canvas id="canvas"></canvas>

    <!-- Atmospheric overlay -->
    <div class="vignette"></div>

    <!-- Loading -->
    <div id="loading">
        <div class="loading-heart">❤️</div>
        <div class="loading-text">Preparing something special</div>
        <div class="loading-subtext">Please allow camera access</div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
        <div class="instruction-title">
            ✊ Hold your right hand in a fist
        </div>

        <div class="instruction-text">
            Bring the heart together...
        </div>
    </div>

    <!-- Status -->
    <div id="status">
        Waiting for your hands...
    </div>

    <div id="camera-message">
        Camera access is required for the interaction.
    </div>

    <!-- Our JavaScript -->
    <script src="app.js"></script>

</body>
</html>
